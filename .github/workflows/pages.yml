name: Deploy Marp to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install LilyPond
        run: |
          sudo apt-get update
          sudo apt-get install --yes lilypond

      - name: Generate music notation
        run: |
          mkdir -p assets/generated
          lilypond --svg -dno-point-and-click --output=assets/generated/score music/example.ly

      - name: Generate diagrams
        run: |
          curl --fail --retry 3 \
            --header "Content-Type: text/plain" \
            --data-binary @diagrams/solution-flow.mmd \
            https://kroki.io/mermaid/svg \
            --output assets/generated/mermaid.svg
          curl --fail --retry 3 \
            --header "Content-Type: text/plain" \
            --data-binary @diagrams/solver-sequence.puml \
            https://kroki.io/plantuml/svg \
            --output assets/generated/plantuml.svg

      - name: Build HTML
        run: |
          mkdir -p _site
          npx --yes @marp-team/marp-cli@4.3.0 template.md --theme-set aizome.css --output _site/index.html

      - name: Copy assets
        run: cp -R assets _site/assets

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
